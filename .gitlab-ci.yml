stages:
  - Release

release:create-tag:
  stage: Release
  image: kroniak/ssh-client
  tags:
    - docker
  before_script:
    - apk add curl jq
  script:
    - 'curl -s --request DELETE --header "PRIVATE-TOKEN: $PRIVATE_TOKEN" --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/dev-main"'
    - 'curl -s --request POST   --header "PRIVATE-TOKEN: $PRIVATE_TOKEN" --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags?tag_name=dev-main&ref=main"'
    - 'curl -s --request GET    --header "PRIVATE-TOKEN: $PRIVATE_TOKEN" --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages" > packages'
    - 'export DEV_MAIN_PACKAGE_ID=$(jq ".[] | select(.version==\"dev-main\") | .id" packages)'
    - 'curl -s --request DELETE --header "Job-Token: $CI_JOB_TOKEN" --url "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/$DEV_MAIN_PACKAGE_ID"'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

release:create-package:
  stage: Release
  image: kroniak/ssh-client
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add curl
  script:
    - 'curl --header "Job-Token: $CI_JOB_TOKEN" --data tag=$CI_COMMIT_TAG "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/composer"'
