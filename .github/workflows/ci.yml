name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl
          # PCOV is faster than Xdebug for line coverage; only enable on
          # the newest PHP so the rest of the matrix stays fast.
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Unit tests
        run: composer test:unit

      - name: Drift test
        run: composer test:drift

      - name: PHPStan
        run: composer stan

      - name: Coverage (PHP 8.4 only)
        if: matrix.php == '8.4'
        run: vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage.xml --coverage-text

      - name: Upload coverage artifact
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Integration tests run against the HyperSwitch sandbox and require a secret.
  # Scheduled nightly rather than on every PR.
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Integration tests
        env:
          HYPERSWITCH_SANDBOX_KEY: ${{ secrets.HYPERSWITCH_SANDBOX_KEY }}
        run: composer test:integration
